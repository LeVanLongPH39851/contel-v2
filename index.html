<!doctype html>
<html lang="vi" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>
      ConteL — Content Intelligence · Sức khỏe Nội dung các chương trình của VTV
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ['"Be Vietnam Pro"', "sans-serif"] },
            colors: {
              brand: {
                50: "#eef2ff",
                100: "#e0e7ff",
                500: "#6366f1",
                600: "#4f46e5",
                700: "#4338ca",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Be Vietnam Pro", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }
      .tip {
        position: relative;
        display: inline-flex;
        cursor: help;
      }
      .tip > span {
        visibility: hidden;
        opacity: 0;
        transition: 0.2s;
        position: absolute;
        bottom: 135%;
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: 270px;
        z-index: 60;
      }
      .tip:hover > span {
        visibility: visible;
        opacity: 1;
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
      }
      thead th {
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .grp-c {
        background: rgba(99, 102, 241, 0.05);
      }
      .dark .grp-c {
        background: rgba(99, 102, 241, 0.13);
      }
      .grp-s {
        background: rgba(14, 165, 233, 0.05);
      }
      .dark .grp-s {
        background: rgba(14, 165, 233, 0.13);
      }
      .sq {
        display: grid;
        grid-template-columns: repeat(2, 5px);
        grid-template-rows: repeat(3, 5px);
        gap: 3px;
      }
      .sq i {
        display: block;
        width: 5px;
        height: 5px;
        background: #22d3ee;
        border-radius: 1px;
      }
      .sq i.o {
        opacity: 0;
      }

      /* ── Filter Dropdown (.fdd) ─────────────────────────────── */
      .fdd {
        position: relative;
        display: inline-flex;
      }
      .fdd-trigger {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 9px 0 10px;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
        background: #fff;
        color: #475569;
        font-size: 11px;
        font-weight: 500;
        font-family: "Be Vietnam Pro", sans-serif;
        cursor: pointer;
        white-space: nowrap;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          background 0.15s;
        user-select: none;
      }
      .fdd-trigger:hover {
        border-color: #c7d2fe;
        background: #f8fafc;
      }
      .fdd.open .fdd-trigger {
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
        color: #4f46e5;
      }
      .fdd-arrow {
        width: 10px;
        height: 10px;
        flex-shrink: 0;
        color: #94a3b8;
        transition: transform 0.2s;
      }
      .fdd.open .fdd-arrow {
        transform: rotate(180deg);
        color: #6366f1;
      }
      .fdd-panel {
        display: none;
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        min-width: 170px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.1),
          0 2px 6px rgba(0, 0, 0, 0.06);
        z-index: 200;
        overflow: hidden;
        padding: 4px 0;
        animation: fdd-in 0.15s ease;
      }
      .fdd.open .fdd-panel {
        display: block;
      }
      @keyframes fdd-in {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fdd-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        font-size: 11.5px;
        color: #334155;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.1s;
        user-select: none;
      }
      .fdd-item:hover {
        background: #f1f5f9;
      }
      .fdd-check {
        flex-shrink: 0;
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1.5px solid #cbd5e1;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .fdd-check.checked {
        border-color: #6366f1;
        background: #6366f1;
      }
      .fdd-check.checked::after {
        content: "";
        display: block;
        width: 7px;
        height: 4px;
        border-left: 1.5px solid #fff;
        border-bottom: 1.5px solid #fff;
        transform: rotate(-45deg) translate(0.5px, -0.5px);
      }
      .fdd-divider {
        height: 1px;
        background: #f1f5f9;
        margin: 3px 0;
      }
      .fdd-all {
        font-weight: 600;
        color: #475569;
      }

      /* Dark mode */
      .dark .fdd-trigger {
        border-color: #334155;
        background: #1e293b;
        color: #94a3b8;
      }
      .dark .fdd-trigger:hover {
        border-color: #4f46e5;
        background: #1e293b;
      }
      .dark .fdd.open .fdd-trigger {
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        color: #818cf8;
      }
      .dark .fdd-panel {
        background: #1e293b;
        border-color: #334155;
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.4),
          0 2px 6px rgba(0, 0, 0, 0.25);
      }
      .dark .fdd-item {
        color: #cbd5e1;
      }
      .dark .fdd-item:hover {
        background: #273549;
      }
      .dark .fdd-check {
        border-color: #475569;
        background: #0f172a;
      }
      .dark .fdd-check.checked {
        border-color: #6366f1;
        background: #6366f1;
      }
      .dark .fdd-divider {
        background: #273549;
      }
      .dark .fdd-all {
        color: #94a3b8;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 text-[13px]"
  >
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
